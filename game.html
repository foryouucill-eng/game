
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Truth or Dare Couple ♡</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;min-height:100vh;
 font-family:Georgia,serif;color:#873e61;
 background:linear-gradient(135deg,#ffeaf4,#fbd0e4,#fff4f8);
}
main{max-width:650px;margin:auto}
h1{text-align:center;color:#cf5c92}
.card{
 background:#ffffffbd;padding:24px;border-radius:24px;
 margin:15px 0;box-shadow:0 10px 30px #c85d8820
}
input,textarea{
 width:100%;padding:13px;margin:7px 0;
 border:1px solid #f0bcd5;border-radius:12px;
 font:inherit;background:#fff9fc
}
textarea{min-height:100px}
button{
 padding:13px 18px;border:0;border-radius:12px;
 background:#d65b91;color:white;font-weight:bold;
 cursor:pointer;font:inherit
}
.secondary{background:#f6d3e4;color:#873e61}
.row{display:flex;gap:10px;margin-top:10px}
.row button{flex:1}
.hidden{display:none}
.status{background:#fff0f6;padding:12px;border-radius:12px;margin:12px 0}
.question{background:#fff0f6;padding:20px;border-radius:15px;text-align:center;font-size:20px;margin:15px 0}
.answer{background:#fff8fc;padding:13px;border-radius:12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
small{color:#b17491}
</style>
</head>

<body>
<main>
<h1>Truth or Dare ♡</h1>
<p style="text-align:center">a little game for the two of us</p>

<div class="card" id="setup">
<h3>♡ Masuk permainan</h3>
<label>Nama kamu</label>
<input id="name" placeholder="Nama panggilan">
<label>Kode room</label>
<input id="code" placeholder="Kode room">
<div class="row">
<button onclick="createRoom()">Buat room</button>
<button class="secondary" onclick="joinRoom()">Gabung</button>
</div>
<div id="message" class="status"></div>
</div>

<div class="card hidden" id="game">
<h3>Room ♡ <span id="room"></span></h3>
<button class="secondary" onclick="copyCode()">Salin kode room</button>
<div class="status" id="players"></div>
<div class="status" id="turn"></div>

<div class="row">
<button onclick="choose('truth')">♡ Truth</button>
<button class="secondary" onclick="choose('dare')">♡ Dare</button>
</div>

<div class="question" id="question">Pilih Truth atau Dare ♡</div>

<div id="answerArea" class="hidden">
<textarea id="answer" placeholder="Tulis jawaban kamu..."></textarea>
<button style="width:100%" onclick="sendAnswer()">Kirim jawaban ♡</button>
</div>

<hr>
<h3>♡ Jawaban kalian</h3>
<div id="answers">Belum ada jawaban.</div>
</div>
</main>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getDatabase,ref,set,get,update,push,onValue
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* GANTI DENGAN CONFIG FIREBASE KAMU */
const firebaseConfig={
 apiKey:"PASTE_API_KEY",
 authDomain:"PASTE_PROJECT_ID.firebaseapp.com",
 databaseURL:"https://PASTE_PROJECT_ID-default-rtdb.firebaseio.com",
 projectId:"PASTE_PROJECT_ID",
 appId:"PASTE_APP_ID"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const $=id=>document.getElementById(id);
let nama="",room="",uid="",data={},myTurn=false;

const truth=[
"Apa hal pertama yang bikin kamu suka aku?",
"Apa kenangan kita paling berkesan?",
"Kapan terakhir kamu kangen aku?",
"Apa hal kecil dariku yang kamu suka?",
"Apa date impian kita?",
"Apa panggilan kesukaanmu dariku?",
"Apa yang bikin kamu merasa disayang?",
"Apa satu hal yang ingin kita lakukan bersama?"
];

const dare=[
"Tulis 3 hal yang kamu suka dariku.",
"Buat gombalan paling romantis.",
"Kirim pesan sayang dalam 5 kata.",
"Ceritakan kenangan kita dalam 5 kata.",
"Kirim 5 emoji love.",
"Tulis rencana date impian kita.",
"Nyatakan cinta dengan cara paling lucu.",
"Pilih lagu yang mengingatkanmu padaku."
];

const playerKey=()=> "p_"+uid;
const roomRef=()=>ref(db,"rooms/"+room);

function showMessage(t){$("message").textContent=t}

async function createRoom(){
 nama=$("name").value.trim();
 if(!nama)return showMessage("Isi nama kamu dulu ♡");
 room=Math.random().toString(36).substring(2,8).toUpperCase();
 $("code").value=room;
 await enter(true);
}

async function joinRoom(){
 nama=$("name").value.trim();
 room=$("code").value.trim().toUpperCase();
 if(!nama||!room)return showMessage("Isi nama dan kode room.");
 await enter(false);
}

async function enter(create){
 uid=localStorage.getItem("couple_uid")||
 "id_"+Math.random().toString(36).slice(2);
 localStorage.setItem("couple_uid",uid);

 try{
  const r=roomRef();
  const snap=await get(r);

  if(create){
   await set(r,{players:{},answers:{},turn:null,current:null});
  }else if(!snap.exists()){
   return showMessage("Room tidak ditemukan ♡");
  }

  await set(ref(db,"rooms/"+room+"/players/"+playerKey()),
  {name:nama});

  const latest=(await get(r)).val();
  const keys=Object.keys(latest.players||{});

  if(keys.length===1)await update(r,{turn:keys[0]});

  $("setup").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("room").textContent=room;

  onValue(r,s=>{
   if(!s.exists())return;
   data=s.val();
   render();
  });
 }catch(e){
  showMessage("Firebase belum tersambung. Periksa config.");
 }
}

function render(){
 const players=Object.entries(data.players||{});
 myTurn=data.turn===playerKey();

 $("players").textContent="Pemain: "+
 players.map(p=>p[1].name).join(" & ");

 $("turn").textContent=players.length<2?
 "Menunggu pasangan bergabung ♡":
 myTurn?"Giliran kamu ♡":"Giliran pasanganmu ♡";

 $("question").textContent=data.current?.text||
 "Pilih Truth atau Dare ♡";

 $("answerArea").classList.toggle("hidden",
 !myTurn||!data.current||data.current.answered);

 const answers=Object.values(data.answers||{});
 $("answers").innerHTML=answers.length?
 answers.map(a=>`<div class="answer"><b>♡ ${esc(a.name)}</b><br>${esc(a.text)}<br><small>${esc(a.type)}</small></div>`).join("")
 :"Belum ada jawaban.";
}

function esc(t){
 return String(t).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 }[c]));
}

async function choose(type){
 if(!myTurn)return alert("Tunggu giliran kamu ♡");
 const list=type==="truth"?truth:dare;
 const text=list[Math.floor(Math.random()*list.length)];

 await update(roomRef(),{
 current:{text,type,answered:false},
 turn:playerKey()
 });
}

async function sendAnswer(){
 const text=$("answer").value.trim();
 if(!text)return alert("Isi jawaban dulu ♡");

 await push(ref(db,"rooms/"+room+"/answers"),{
 name:nama,text,type:data.current.type
 });

 const keys=Object.keys(data.players||{});
 const next=keys.find(k=>k!==playerKey())||playerKey();

 await update(roomRef(),{
 current:{...data.current,answered:true},
 turn:next
 });
 $("answer").value="";
}

async function copyCode(){
 await navigator.clipboard.writeText(room);
 alert("Kode room tersalin ♡");
}

window.createRoom=createRoom;
window.joinRoom=joinRoom;
window.choose=choose;
window.sendAnswer=sendAnswer;
window.copyCode=copyCode;
</script>
</body>
</html>
