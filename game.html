
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truth or Dare Couple ♡</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffe1ec, #fff5f9, #ffd6e8);
    color: #a33e69;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 520px;
    background: white;
    padding: 25px;
    border-radius: 25px;
    box-shadow: 0 10px 35px #e99bbd55;
    text-align: center;
}

.hidden {
    display: none !important;
}

h1, h2, h3 {
    color: #d94d8b;
}

input {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border: 1px solid #ffc4dd;
    border-radius: 12px;
    outline: none;
    font-size: 15px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    cursor: pointer;
    background: #f58bb8;
    color: white;
    font-weight: bold;
    transition: .2s;
}

button:hover {
    background: #e66ca3;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.btn-full {
    width: 100%;
    margin-top: 10px;
}

.status {
    margin: 12px 0;
    padding: 12px;
    border-radius: 12px;
    background: #fff0f6;
}

/* CARD TRUTH DARE */

.tod-cards {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin: 30px 0;
}

.tod-card {
    width: 180px;
    height: 255px;
    perspective: 1000px;
    cursor: pointer;
    background: transparent;
    padding: 0;
    border: none;
    box-shadow: none;
    flex-shrink: 0;
}

.card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .75s cubic-bezier(.2,.7,.2,1);
}

.tod-card.open .card-inner {
    transform: rotateY(180deg);
}

.card-front,
.card-back {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 20px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 16px;
    overflow: hidden;
    text-align: center;
}

.card-front {
    color: white;
    font-size: 24px;
    font-weight: bold;
    background: linear-gradient(145deg, #ff8fbd, #e64f91);
    box-shadow: 0 8px 20px #e56a9c55;
}

.dare-card .card-front {
    background: linear-gradient(145deg, #ffb2d3, #e95c9c);
}

.card-back {
    transform: rotateY(180deg);
    background: linear-gradient(145deg, #fff0f7, #ffd9eb);
    border: 2px solid #f6a6ca;
    color: #a33e69;
    box-shadow: 0 8px 20px #e56a9c35;
}

.card-back .question-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 12px;
}

.card-back .question-text {
    font-size: 15px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.card-back .card-hint {
    font-size: 11px;
    margin-top: 15px;
    opacity: .7;
}

.tod-card:hover:not(.open) {
    transform: translateY(-5px);
}

.tod-card.open:hover {
    transform: none;
}

.game-note {
    font-size: 13px;
    opacity: .8;
}

.answer-item {
    background: #fff0f6;
    padding: 12px;
    border-radius: 12px;
    margin: 8px 0;
    text-align: left;
    overflow-wrap: anywhere;
}

@media(max-width: 420px) {
    .card {
        padding: 18px;
    }

    .tod-cards {
        gap: 12px;
    }

    .tod-card {
        width: 145px;
        height: 220px;
    }

    .card-front {
        font-size: 20px;
    }

    .card-back .question-text {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<!-- HALAMAN AWAL -->
<div class="card" id="home">
    <h1>♡ Truth or Dare ♡</h1>
    <p>Play with your favorite person</p>

    <input id="nama" placeholder="Nama kamu">

    <button class="btn-full" onclick="createRoom()">
        Buat Room ♡
    </button>

    <hr style="border:0;border-top:1px solid #ffe0ed;margin:20px 0">

    <input id="kode" placeholder="Kode room">
    <button class="btn-full" onclick="joinRoom()">
        Gabung Room ♡
    </button>
</div>

<!-- HALAMAN GAME -->
<div class="card hidden" id="game">
    <h3>Room ♡ <span id="room"></span></h3>

    <button onclick="copyCode()">Salin Kode Room</button>

    <div id="players" class="status"></div>
    <div id="turn" class="status"></div>

    <!-- KEDUA KARTU HARUS DI DALAM TOD-CARDS -->
    <div class="tod-cards">

        <!-- TRUTH -->
        <div class="tod-card truth-card"
             id="truthCard"
             onclick="choose('truth')">

            <div class="card-inner">

                <div class="card-front">
                    <span>♡</span>
                    <span>TRUTH</span>
                    <small style="font-size:12px;margin-top:12px">
                        Tap to open
                    </small>
                </div>

                <div class="card-back">
                    <div class="question-title">♡ TRUTH ♡</div>
                    <div class="question-text" id="truthQuestion">
                        Pertanyaan Truth
                    </div>
                    <div class="card-hint">Jawab dengan jujur ♡</div>
                </div>

            </div>
        </div>

        <!-- DARE -->
        <div class="tod-card dare-card"
             id="dareCard"
             onclick="choose('dare')">

            <div class="card-inner">

                <div class="card-front">
                    <span>♡</span>
                    <span>DARE</span>
                    <small style="font-size:12px;margin-top:12px">
                        Tap to open
                    </small>
                </div>

                <div class="card-back">
                    <div class="question-title">♡ DARE ♡</div>
                    <div class="question-text" id="dareQuestion">
                        Tantangan Dare
                    </div>
                    <div class="card-hint">Berani menerima tantangan? ♡</div>
                </div>

            </div>
        </div>

    </div>

    <p class="game-note">
        Pilih salah satu kartu ketika giliranmu ♡
    </p>

    <div id="answerArea" class="hidden">
        <h3>Jawaban kamu ♡</h3>
        <textarea id="jawaban"
                  placeholder="Tulis jawaban di sini..."
                  style="width:100%;min-height:90px;padding:12px;border:1px solid #ffc4dd;border-radius:12px"></textarea>
        <button class="btn-full" onclick="sendAnswer()">
            Kirim Jawaban
        </button>
    </div>

    <h3>♡ Jawaban ♡</h3>
    <div id="answers"></div>

    <button class="btn-full" onclick="location.reload()">
        Keluar Room
    </button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getDatabase,
    ref,
    set,
    get,
    update,
    push,
    onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* GANTI DENGAN FIREBASE CONFIG MILIK KAMU */
const firebaseConfig = {
    apiKey: "ISI_API_KEY",
    authDomain: "truthordare-d35ed.firebaseapp.com",
    databaseURL: "https://truthordare-d35ed-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "truthordare-d35ed",
    storageBucket: "truthordare-d35ed.firebasestorage.app",
    messagingSenderId: "ISI_MESSAGING_SENDER_ID",
    appId: "ISI_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const $ = id => document.getElementById(id);

let nama = "";
let room = "";
let uid = "";
let data = {};
let myTurn = false;
let unsubscribe = null;

/* DAFTAR PERTANYAAN */
const truth = [
    "Apa hal yang paling kamu suka dari aku?",
    "Pernah cemburu karena aku?",
    "Apa first impression kamu tentang aku?",
    "Apa hal yang paling kamu takutkan dalam hubungan?",
    "Siapa yang lebih sering kangen?",
    "Apa momen favorit kamu bersama aku?",
    "Pernah pura-pura tidak cemburu?",
    "Apa panggilan sayang favoritmu?",
    "Apa hal kecil yang bikin kamu bahagia?",
    "Apa yang ingin kamu lakukan bersama aku?"
];

const dare = [
    "Kirim voice note bilang aku sayang kamu.",
    "Beri aku 3 pujian.",
    "Kirim selfie dengan ekspresi lucu.",
    "Panggil aku dengan panggilan sayang.",
    "Tulis pesan romantis untuk aku.",
    "Kirim emoji yang menggambarkan perasaanmu.",
    "Nyanyikan lagu romantis lewat voice note.",
    "Ceritakan satu hal yang membuatmu kangen.",
    "Buat caption romantis untuk aku.",
    "Katakan sesuatu yang belum pernah kamu katakan."
];

const playerKey = () => "p_" + uid;
const roomRef = () => ref(db, "rooms/" + room);

/* BUAT ROOM */
window.createRoom = async function() {
    nama = $("nama").value.trim();

    if (!nama) {
        alert("Masukkan nama terlebih dahulu!");
        return;
    }

    uid = localStorage.getItem("couple_uid");

    if (!uid) {
        uid = crypto.randomUUID();
        localStorage.setItem("couple_uid", uid);
    }

    room = Math.random().toString(36).substring(2, 7).toUpperCase();

    await set(roomRef(), {
        players: {
            [playerKey()]: {
                nama: nama,
                uid: uid
            }
        },
        answers: {},
        turn: playerKey(),
        current: null
    });

    startGame();
};

/* GABUNG ROOM */
window.joinRoom = async function() {
    nama = $("nama").value.trim();
    room = $("kode").value.trim().toUpperCase();

    if (!nama || !room) {
        alert("Isi nama dan kode room!");
        return;
    }

    uid = localStorage.getItem("couple_uid");

    if (!uid) {
        uid = crypto.randomUUID();
        localStorage.setItem("couple_uid", uid);
    }

    const snapshot = await get(roomRef());

    if (!snapshot.exists()) {
        alert("Room tidak ditemukan!");
        return;
    }

    const roomData = snapshot.val();
    const players = roomData.players || {};

    if (players[playerKey()]) {
        startGame();
        return;
    }

    if (Object.keys(players).length >= 2) {
        alert("Room sudah penuh!");
        return;
    }

    await update(roomRef(), {
        ["players/" + playerKey()]: {
            nama: nama,
            uid: uid
        }
    });

    if (!roomData.turn) {
        await update(roomRef(), {
            turn: Object.keys(players)[0]
        });
    }

    startGame();
};

/* MASUK GAME */
function startGame() {
    $("home").classList.add("hidden");
    $("game").classList.remove("hidden");
    $("room").textContent = room;

    if (unsubscribe) unsubscribe();

    unsubscribe = onValue(roomRef(), snapshot => {
        if (!snapshot.exists()) return;

        data = snapshot.val();
        render();
    });
}

/* TAMPILAN REALTIME */
function render() {
    const players = data.players || {};
    const playerList = Object.values(players);

    $("players").innerHTML =
        "♡ " + playerList.map(p => escapeHTML(p.nama)).join(" & ");

    myTurn = data.turn === playerKey();

    $("turn").textContent = myTurn
        ? "♡ Giliran kamu!"
        : "♡ Menunggu pasangan...";

    const current = data.current;

    $("truthCard").classList.toggle(
        "open",
        current?.type === "truth"
    );

    $("dareCard").classList.toggle(
        "open",
        current?.type === "dare"
    );

    $("truthQuestion").textContent =
        current?.type === "truth"
            ? current.text
            : "Pilih kartu Truth untuk membuka pertanyaan.";

    $("dareQuestion").textContent =
        current?.type === "dare"
            ? current.text
            : "Pilih kartu Dare untuk membuka tantangan.";

    const answered = current?.answered === true;

    $("answerArea").classList.toggle(
        "hidden",
        !(myTurn && current && !answered && playerList.length === 2)
    );

    $("jawaban").value = "";

    const answers = data.answers || {};

    $("answers").innerHTML = Object.values(answers)
        .map(a => `
            <div class="answer-item">
                <b>${escapeHTML(a.nama)}</b><br>
                ${escapeHTML(a.text)}
            </div>
        `)
        .join("");
}

/* PILIH KARTU */
window.choose = async function(type) {
    const players = data.players || {};

    if (!myTurn) {
        alert("Tunggu giliran kamu ya ♡");
        return;
    }

    if (Object.keys(players).length < 2) {
        alert("Tunggu pasangan bergabung terlebih dahulu!");
        return;
    }

    if (data.current && !data.current.answered) {
        alert("Jawab pertanyaan sebelumnya terlebih dahulu!");
        return;
    }

    const list = type === "truth" ? truth : dare;
    const question = list[Math.floor(Math.random() * list.length)];

    await update(roomRef(), {
        current: {
            type: type,
            text: question,
            answered: false
        }
    });
};

/* KIRIM JAWABAN */
window.sendAnswer = async function() {
    const text = $("jawaban").value.trim();

    if (!text) {
        alert("Isi jawaban terlebih dahulu!");
        return;
    }

    if (!myTurn || !data.current || data.current.answered) {
        return;
    }

    const players = Object.keys(data.players || {});
    const nextPlayer = players.find(p => p !== playerKey());

    const answerRef = push(ref(db, "rooms/" + room + "/answers"));

    await set(answerRef, {
        nama: nama,
        text: text,
        type: data.current.type,
        question: data.current.text
    });

    await update(roomRef(), {
        "current/answered": true,
        turn: nextPlayer
    });
};

/* SALIN KODE */
window.copyCode = async function() {
    await navigator.clipboard.writeText(room);
    alert("Kode room berhasil disalin ♡");
};

/* ESCAPE HTML */
function escapeHTML(text) {
    return String(text ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    }[char]));
}
</script>

</body>
</html>
